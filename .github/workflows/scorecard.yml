name: Scorecard supply-chain security

# OpenSSF Scorecard. Runs weekly + on push to main. Results are uploaded as
# SARIF so they surface in the GitHub Security tab, and published to the
# public OpenSSF API so Socket.dev (and other tools) can read the score.
#
# All third-party actions are pinned by 40-char commit SHA.

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF
      id-token: write          # publish results to OpenSSF
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default workflow token cannot read classic branch protection, so
          # Branch-Protection goes unscored. SCORECARD_TOKEN is a fine-grained,
          # read-only token (Administration: read) added as a repository secret;
          # until it exists this falls back to the workflow token, as before.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: results.sarif
