name: Scorecard supply-chain security

# OpenSSF Scorecard. Runs weekly + on push to main. Results are uploaded as
# SARIF so they surface in the GitHub Security tab, and published to the
# public OpenSSF API so Socket.dev (and other tools) can read the score.
#
# All third-party actions are pinned by 40-char commit SHA.

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF
      id-token: write          # publish results to OpenSSF
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default workflow token cannot read classic branch protection, so
          # Branch-Protection goes unscored. SCORECARD_TOKEN is a fine-grained,
          # read-only token (Administration: read) added as a repository secret;
          # until it exists this falls back to the workflow token, as before.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          sarif_file: results.sarif
